name: Update React-PDF

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-react-pdf
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and update React-PDF and matching PDF.js
        id: update
        run: node .github/scripts/update-react-pdf.mjs

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.update.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: steps.update.outputs.changed == 'true'
        run: |
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Set up Chrome and ChromeDriver
        if: steps.update.outputs.changed == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Validate updated dependencies
        if: steps.update.outputs.changed == 'true'
        env:
          DASH_TEST_CHROMEPATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          pnpm exec tsc --noEmit
          pnpm run build
          uv run --frozen pytest -q --headless

      - name: Create or update dependency PR
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-react-pdf
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          add-paths: |
            package.json
            pnpm-lock.yaml
          commit-message: "chore(deps): update react-pdf to ${{ steps.update.outputs.version }}"
          title: "chore(deps): update react-pdf to ${{ steps.update.outputs.version }}"
          body: |
            Update React-PDF to `${{ steps.update.outputs.version }}` and its matching PDF.js dependency to `${{ steps.update.outputs.pdfjs-version }}`.

            Updates package.json and the pnpm lockfile. Generated build files remain ignored.

            Validation completed in this workflow:
            - TypeScript type checking
            - Component generation and production build
            - Python tests including browser rendering and navigation tests

            Review upstream release notes and compatibility before merging. This PR is not automatically merged.
